# Descarga las fichas técnicas públicas del proveedor (neuronecosmetica.com) y extrae su texto.
# Temporal, autorizada por Sam el 2026-09-26: corre sólo en esta rama y se retira antes del PR.
# Motivo: el proxy de la sesión de CC bloquea el dominio y pg_net trunca binarios.
name: descarga-fichas-proveedor
on:
  push:
    branches: [claude/practical-hamilton-qy6okc]
    paths: [brands/NeuroneSCF/supplier/fichas_tecnicas/urls.txt, .github/workflows/descarga-fichas-proveedor.yml]
permissions:
  contents: write
jobs:
  descarga:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Descargar y extraer
        run: |
          cd brands/NeuroneSCF/supplier/fichas_tecnicas
          mkdir -p pdf txt
          : > descarga.log
          while read -r u; do
            [ -z "$u" ] && continue
            f=$(basename "$u"); f=${f%.pdf.pdf}; f=${f%.pdf}.pdf
            code=$(curl -sSL -A "Mozilla/5.0" -o "pdf/$f" -w '%{http_code}' "$u" || echo ERR)
            size=$(stat -c %s "pdf/$f" 2>/dev/null || echo 0)
            pdftotext -layout "pdf/$f" "txt/${f%.pdf}.txt" || true
            echo "$code $size $f $u" >> descarga.log
          done < urls.txt
          cat descarga.log
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brands/NeuroneSCF/supplier/fichas_tecnicas
          git commit -m "Fichas técnicas del proveedor: PDF y texto extraído (descarga automática)" || echo "sin cambios"
          git push
